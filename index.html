<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Surskity Tracker Premium</title>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Chart.js -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>

    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;900&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">

    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #09090b; /* Zinc 950 */
        }
        .font-mono {
            font-family: 'JetBrains Mono', monospace;
        }
        
        /* Custom Scrollbar */
        ::-webkit-scrollbar {
            width: 6px;
        }
        ::-webkit-scrollbar-track {
            background: #09090b; 
        }
        ::-webkit-scrollbar-thumb {
            background: #3f3f46; 
            border-radius: 3px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #ec4899; 
        }

        /* Glassmorphism & Effects */
        .glass-panel {
            background: rgba(24, 24, 27, 0.7);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.05);
        }
        .premium-shadow {
            box-shadow: 0 4px 20px -2px rgba(0, 0, 0, 0.5);
        }
        .glow-text {
            text-shadow: 0 0 20px rgba(236, 72, 153, 0.3);
        }
        
        /* Transitions */
        .fade-in {
            animation: fadeIn 0.3s ease-in-out;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(5px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* Tab Active State */
        .tab-active {
            background-color: #ec4899;
            color: white;
            border-color: #ec4899;
        }
        .tab-inactive {
            background-color: transparent;
            color: #a1a1aa;
            border-color: #27272a;
        }
        .tab-inactive:hover {
            border-color: #ec4899;
            color: #fbcfe8;
        }
    </style>
    
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        zinc: {
                            850: '#1f1f22',
                            900: '#18181b',
                            950: '#09090b',
                        }
                    }
                }
            }
        }
    </script>
</head>
<body class="text-zinc-200 min-h-screen selection:bg-pink-500 selection:text-white pb-12">

    <div class="max-w-5xl mx-auto px-4 py-8 space-y-8">
        
        <!-- HEADER -->
        <header class="text-center space-y-4 pt-4">
            <div class="inline-block relative">
                <div class="absolute inset-0 blur-xl bg-pink-500/20 rounded-full"></div>
                <h1 class="relative text-5xl md:text-7xl font-black text-white tracking-tight glow-text">
                    SURSKITY
                    <span class="text-transparent bg-clip-text bg-gradient-to-r from-pink-500 to-rose-600">TRACKER</span>
                </h1>
            </div>
            <p class="text-zinc-500 text-sm font-medium tracking-[0.2em] uppercase">
                Monitoramento de Performance High-Stakes
            </p>
        </header>

        <!-- NAVIGATION TABS -->
        <div class="flex justify-center space-x-4 mb-8">
            <button onclick="switchTab('overview')" id="tab-overview" class="px-6 py-2 rounded-full border transition-all duration-300 font-medium text-sm flex items-center gap-2 tab-active">
                <i data-lucide="layout-dashboard" size="16"></i>
                Visão Geral
            </button>
            <button onclick="switchTab('calendar')" id="tab-calendar" class="px-6 py-2 rounded-full border transition-all duration-300 font-medium text-sm flex items-center gap-2 tab-inactive">
                <i data-lucide="calendar" size="16"></i>
                Calendário
            </button>
        </div>

        <!-- CONTENT AREA -->
        <div id="content-area" class="fade-in">
            <!-- Content Injected by JS -->
        </div>

    </div>

    <!-- JAVASCRIPT LOGIC -->
    <script>
        // --- DADOS ---
        const historyData = [
            {
                id: 0,
                date: '08/02/2026',
                deposit: 17215,
                withdraw: 0,
                games: ['Casino'],
                houses: ['Casa de Apostas'],
                won: false
            },
            {
                id: 1,
                date: '09/02/2026',
                deposit: 6000,
                withdraw: 11442,
                games: ['Blackjack'],
                houses: ['Casa de Apostas'],
                won: true
            },
            {
                id: 2,
                date: '10/02/2026',
                deposit: 1000,
                withdraw: 0, 
                games: ['Slots'],
                houses: ['Casa de Apostas'],
                won: false
            },
            {
                id: 3,
                date: '11/02/2026',
                deposit: 2000,
                withdraw: 4400,
                giveaway: 3804, // Valor distribuido pro chat
                games: ['Slots'],
                houses: ['Casa de Apostas'],
                won: false
            },
            {
                id: 4,
                date: '12/02/2026',
                deposit: 2000,
                withdraw: 0,
                games: ['Slots'],
                houses: ['Casa de Apostas'],
                won: false
            },
            {
                id: 5,
                date: '13/02/2026',
                deposit: 8900, // 8000 + 900
                withdraw: 7500, // Recuperou parte, mas fechou negativo
                games: ['Slots'],
                houses: ['Casa de Apostas'],
                won: false
            },
            {
                id: 6,
                date: '14/02/2026',
                deposit: 7000,
                withdraw: 11000,
                games: ['Slots'],
                houses: ['Casa de Apostas'],
                won: true
            },
            {
                id: 7,
                date: '15/02/2026',
                deposit: 13500, // 1500 + 12000
                withdraw: 10537, // 7800 + 2737
                games: ['Slots'],
                houses: ['Casa de Apostas'],
                won: false
            },
            {
                id: 8,
                date: '17/02/2026',
                deposit: 6000,
                withdraw: 0,
                games: ['Slots'],
                houses: ['Casa de Apostas'],
                won: false
            },
            {
                id: 9,
                date: '18/02/2026',
                deposit: 5000,
                withdraw: 4000,
                giveaway: 2000,
                games: ['Slots'],
                houses: ['Casa de Apostas'],
                won: false
            }
        ];

        // --- STATE ---
        let currentTab = 'overview';
        let selectedDate = null;

        // --- UTILS ---
        const formatCurrency = (value) => {
            return new Intl.NumberFormat('pt-BR', {
                style: 'currency',
                currency: 'BRL'
            }).format(value);
        };

        const getStats = () => {
            let totalDeposited = 0;
            let totalRealWithdrawn = 0; // Usar o saque REAL para cálculos de lucro
            let currentBankroll = 0;
            let customSaldo = 0; 
            
            const processed = historyData.map(entry => {
                // Lógica Atualizada: O Pix do chat é descontado do saque antes de calcular o lucro
                const giveaway = entry.giveaway || 0;
                const realWithdraw = entry.withdraw - giveaway;
                const profit = realWithdraw - entry.deposit;

                totalDeposited += entry.deposit;
                totalRealWithdrawn += realWithdraw;
                currentBankroll += profit;
                
                // Lógica do Saldo: 
                // Se ganhou (won=true): Soma o saque REAL (já descontado o giveaway)
                // Se perdeu (won=false): Subtrai o depósito (independente se recuperou parte, regra binária)
                if (entry.won) {
                    customSaldo += realWithdraw;
                } else {
                    customSaldo -= entry.deposit;
                }

                return { ...entry, profit, bankroll: currentBankroll };
            });

            // Coletar casas únicas
            const allHouses = [...new Set(historyData.flatMap(d => d.houses || []))];

            return {
                processed,
                netProfit: totalRealWithdrawn - totalDeposited,
                customSaldo, 
                lastEntry: processed[processed.length - 1],
                allHouses
            };
        };

        // --- RENDER FUNCTIONS ---

        function switchTab(tab) {
            currentTab = tab;
            
            // Update Buttons
            document.getElementById('tab-overview').className = `px-6 py-2 rounded-full border transition-all duration-300 font-medium text-sm flex items-center gap-2 ${tab === 'overview' ? 'tab-active' : 'tab-inactive'}`;
            document.getElementById('tab-calendar').className = `px-6 py-2 rounded-full border transition-all duration-300 font-medium text-sm flex items-center gap-2 ${tab === 'calendar' ? 'tab-active' : 'tab-inactive'}`;
            
            // Render Content
            const container = document.getElementById('content-area');
            container.innerHTML = '';
            
            if (tab === 'overview') {
                renderOverview(container);
            } else {
                renderCalendar(container);
            }
            lucide.createIcons();
        }

        function renderOverview(container) {
            const stats = getStats();
            const lastEntry = stats.lastEntry;
            
            // Determine styles for the main status card
            // Nota: Se o lucro do dia for negativo (mesmo que won=true), podemos mudar a cor do valor
            const isWin = lastEntry.won;
            const statusColor = isWin ? 'text-emerald-400' : 'text-rose-400';
            const statusBg = isWin ? 'from-emerald-500/10 to-emerald-500/5 border-emerald-500/20' : 'from-rose-500/10 to-rose-500/5 border-rose-500/20';
            const emoji = isWin ? '😢' : '🤣';
            const title = isWin ? 'SIM, ELE GANHOU' : 'NÃO DEU...';
            const subtitle = isWin ? 'Infelizmente o homem forrou.' : 'Hoje tem rivotril 💊';

            // Generate Houses HTML
            const housesHtml = stats.allHouses.map(h => 
                `<span class="px-2 py-1 bg-zinc-800 border border-zinc-700 rounded text-xs text-zinc-400">${h}</span>`
            ).join('');

            // Cor do Saldo e do Resultado do Dia (pode ser negativo mesmo ganhando)
            const saldoColor = stats.customSaldo >= 0 ? 'text-zinc-300' : 'text-rose-400';
            const dailyResultColor = lastEntry.profit >= 0 ? 'text-emerald-400' : 'text-rose-400';

            // HTML extra se tiver Giveaway
            let giveawayHtml = '';
            if (lastEntry.giveaway && lastEntry.giveaway > 0) {
                giveawayHtml = `
                    <div class="flex items-center justify-end gap-2 mt-1 animate-pulse">
                        <span class="text-xs text-purple-400 font-bold">Pix do Chat:</span>
                        <span class="text-xs text-purple-300 font-mono font-black">-${formatCurrency(lastEntry.giveaway)}</span>
                    </div>
                `;
            }

            const html = `
                <div class="grid grid-cols-1 lg:grid-cols-3 gap-6 animate-fade-in">
                    
                    <!-- LATEST STATUS CARD -->
                    <div class="lg:col-span-3 bg-gradient-to-b ${statusBg} bg-zinc-900/50 rounded-2xl border backdrop-blur-sm p-8 relative overflow-hidden group">
                        <div class="absolute top-0 right-0 p-8 opacity-10 group-hover:opacity-20 transition-opacity text-9xl select-none grayscale">
                            ${isWin ? '📈' : '📉'}
                        </div>
                        
                        <div class="relative z-10 flex flex-col md:flex-row items-center justify-between gap-8">
                            <div class="text-center md:text-left space-y-2">
                                <div class="flex items-center justify-center md:justify-start gap-2 mb-2">
                                    <span class="px-2 py-0.5 rounded text-[10px] font-bold uppercase tracking-wider bg-black/40 border border-white/10 text-zinc-400">
                                        Última Atualização: ${lastEntry.date}
                                    </span>
                                </div>
                                <h2 class="text-4xl md:text-5xl font-black italic tracking-tighter text-white">
                                    ${title} <span class="not-italic text-4xl align-middle ml-2">${emoji}</span>
                                </h2>
                                <p class="${statusColor} font-medium text-lg">${subtitle}</p>
                            </div>

                            <div class="flex flex-col gap-1 text-right">
                                <span class="text-xs font-bold uppercase tracking-widest text-zinc-500">Resultado Real do Dia</span>
                                <span class="text-4xl md:text-5xl font-mono font-bold ${dailyResultColor}">
                                    ${lastEntry.profit > 0 ? '+' : ''}${formatCurrency(lastEntry.profit)}
                                </span>
                                ${giveawayHtml}
                                <div class="flex items-center justify-end gap-2 mt-2">
                                    <span class="text-xs text-zinc-500">Jogos:</span>
                                    <span class="text-xs text-zinc-300 font-medium">${lastEntry.games.join(', ')}</span>
                                </div>
                            </div>
                        </div>
                    </div>

                    <!-- STATS & HOUSES -->
                    <div class="lg:col-span-1 space-y-6">
                        <!-- Total Profit -->
                        <div class="bg-zinc-900 border border-zinc-800 p-6 rounded-xl hover:border-pink-500/30 transition-colors">
                            <div class="flex items-center justify-between mb-4">
                                <span class="text-sm font-medium text-zinc-400">Lucro Líquido Total</span>
                                <i data-lucide="wallet" class="text-pink-500" size="20"></i>
                            </div>
                            <div class="text-3xl font-mono font-bold ${stats.netProfit >= 0 ? 'text-white' : 'text-rose-500'}">
                                ${stats.netProfit >= 0 ? '+' : ''}${formatCurrency(stats.netProfit)}
                            </div>
                            <div class="mt-4 pt-4 border-t border-zinc-800 flex justify-between items-center text-sm">
                                <span class="text-zinc-500">Saldo (Bolso)</span>
                                <span class="${saldoColor} font-mono font-bold">${formatCurrency(stats.customSaldo)}</span>
                            </div>
                        </div>

                        <!-- Houses List -->
                        <div class="bg-zinc-900 border border-zinc-800 p-6 rounded-xl">
                            <div class="flex items-center gap-2 mb-4 text-zinc-400">
                                <i data-lucide="building-2" size="16"></i>
                                <span class="text-sm font-bold uppercase tracking-wider">Casas Forradas</span>
                            </div>
                            <div class="flex flex-wrap gap-2">
                                ${housesHtml || '<span class="text-zinc-600 text-sm italic">Nenhuma casa registrada</span>'}
                            </div>
                        </div>
                    </div>

                    <!-- CHART -->
                    <div class="lg:col-span-2 bg-zinc-900 border border-zinc-800 p-6 rounded-xl">
                        <div class="flex items-center justify-between mb-6">
                            <h3 class="font-bold text-lg text-white flex items-center gap-2">
                                <i data-lucide="trending-up" class="text-pink-500"></i>
                                Evolução da Banca Total
                            </h3>
                        </div>
                        <div class="h-64 w-full relative">
                            <canvas id="profitChart"></canvas>
                        </div>
                    </div>

                </div>
            `;
            
            container.innerHTML = html;
            renderChart(stats.processed);
        }

        function renderCalendar(container) {
            const stats = getStats();
            
            // Setup Feb 2026
            const year = 2026;
            const month = 1; // 0-indexed, 1 = Feb
            const daysInMonth = new Date(year, month + 1, 0).getDate();
            const firstDayIndex = new Date(year, month, 1).getDay(); // Sunday = 0
            
            let daysHtml = '';

            // Empty slots for previous month
            for (let i = 0; i < firstDayIndex; i++) {
                daysHtml += `<div class="aspect-square bg-zinc-900/30 rounded-lg"></div>`;
            }

            // Days
            for (let day = 1; day <= daysInMonth; day++) {
                const dateStr = `${day.toString().padStart(2, '0')}/02/${year}`;
                const entry = stats.processed.find(d => d.date === dateStr);
                
                let content = `<span class="text-zinc-500 text-sm">${day}</span>`;
                let classes = "bg-zinc-900 border border-zinc-800 text-zinc-400 hover:border-zinc-600 cursor-pointer";
                let onClick = "";

                if (entry) {
                    const isWin = entry.profit >= 0; // Agora baseia-se no lucro real (pós giveaway)
                    const colorClass = isWin ? 'bg-emerald-500' : 'bg-rose-500';
                    const textClass = isWin ? 'text-emerald-400' : 'text-rose-400';
                    
                    classes = `bg-zinc-800 border ${isWin ? 'border-emerald-500/30' : 'border-rose-500/30'} cursor-pointer hover:bg-zinc-800/80 transition-all`;
                    
                    content = `
                        <div class="flex flex-col h-full justify-between">
                            <span class="${textClass} font-bold text-sm">${day}</span>
                            <div class="flex flex-col items-end">
                                <div class="w-1.5 h-1.5 rounded-full ${colorClass} mb-1"></div>
                                <span class="text-[10px] font-mono text-zinc-300">
                                    ${entry.profit > 0 ? '+' : ''}${formatCurrency(entry.profit).split(',')[0].replace('R$', '')}
                                </span>
                            </div>
                        </div>
                    `;
                    onClick = `showDayDetails('${dateStr}')`;
                }

                daysHtml += `
                    <div onclick="${onClick}" class="aspect-square rounded-xl p-2 md:p-3 relative group ${classes}">
                        ${content}
                    </div>
                `;
            }

            const html = `
                <div class="grid grid-cols-1 md:grid-cols-3 gap-6 animate-fade-in">
                    <!-- Calendar Grid -->
                    <div class="md:col-span-2 bg-zinc-900 border border-zinc-800 p-6 rounded-2xl">
                        <div class="flex justify-between items-center mb-6">
                            <h2 class="text-xl font-bold text-white flex items-center gap-2">
                                <i data-lucide="calendar-days" class="text-pink-500"></i>
                                Fevereiro 2026
                            </h2>
                            <div class="flex gap-2 text-xs">
                                <span class="flex items-center gap-1 text-zinc-400"><div class="w-2 h-2 rounded-full bg-emerald-500"></div> Gain</span>
                                <span class="flex items-center gap-1 text-zinc-400"><div class="w-2 h-2 rounded-full bg-rose-500"></div> Loss</span>
                            </div>
                        </div>
                        
                        <div class="grid grid-cols-7 gap-2 md:gap-4 mb-2 text-center text-xs font-bold text-zinc-500 uppercase tracking-wider">
                            <div>Dom</div><div>Seg</div><div>Ter</div><div>Qua</div><div>Qui</div><div>Sex</div><div>Sab</div>
                        </div>
                        <div class="grid grid-cols-7 gap-2 md:gap-4">
                            ${daysHtml}
                        </div>
                    </div>

                    <!-- Side Panel: Day Details -->
                    <div class="md:col-span-1">
                        <div id="day-details-panel" class="h-full bg-zinc-900 border border-zinc-800 p-6 rounded-2xl flex items-center justify-center text-center">
                            <div class="space-y-3 text-zinc-500">
                                <i data-lucide="mouse-pointer-click" class="mx-auto mb-2 opacity-50" size="32"></i>
                                <p class="text-sm">Clique em um dia com atividade para ver os detalhes da cassinagem.</p>
                            </div>
                        </div>
                    </div>
                </div>
            `;
            container.innerHTML = html;
        }

        window.showDayDetails = (dateStr) => {
            const stats = getStats();
            const entry = stats.processed.find(d => d.date === dateStr);
            const panel = document.getElementById('day-details-panel');

            if (!entry) return;

            const isWin = entry.profit >= 0;
            const color = isWin ? 'emerald' : 'rose';

            let giveawaySection = '';
            if (entry.giveaway && entry.giveaway > 0) {
                giveawaySection = `
                    <div class="bg-purple-900/20 p-4 rounded-lg border border-purple-500/30 mt-4">
                        <div class="flex justify-between items-center">
                            <p class="text-xs text-purple-400 uppercase font-bold flex items-center gap-2">
                                <i data-lucide="gift" size="14"></i> Pix do Chat
                            </p>
                            <p class="text-lg font-mono font-bold text-purple-300">
                                -${formatCurrency(entry.giveaway)}
                            </p>
                        </div>
                    </div>
                `;
            }

            panel.innerHTML = `
                <div class="w-full h-full flex flex-col justify-start text-left space-y-6 animate-fade-in">
                    <div class="border-b border-zinc-800 pb-4">
                        <span class="text-xs font-bold text-zinc-500 uppercase tracking-wider">Detalhes do Dia</span>
                        <h3 class="text-2xl font-black text-white mt-1">${entry.date}</h3>
                    </div>

                    <div class="space-y-4">
                        <div class="bg-black/20 p-4 rounded-lg border border-zinc-800">
                            <p class="text-xs text-zinc-500 uppercase font-bold">Resultado Real (Cassino - Chat)</p>
                            <p class="text-2xl font-mono font-bold text-${color}-400">
                                ${entry.profit > 0 ? '+' : ''}${formatCurrency(entry.profit)}
                            </p>
                        </div>

                        ${giveawaySection}

                        <div class="grid grid-cols-2 gap-4">
                            <div class="bg-zinc-800/50 p-3 rounded-lg">
                                <p class="text-[10px] text-zinc-500 uppercase">Sacou</p>
                                <p class="font-mono text-zinc-200 text-sm">${formatCurrency(entry.withdraw)}</p>
                            </div>
                            <div class="bg-zinc-800/50 p-3 rounded-lg">
                                <p class="text-[10px] text-zinc-500 uppercase">Depositou</p>
                                <p class="font-mono text-zinc-200 text-sm">${formatCurrency(entry.deposit)}</p>
                            </div>
                        </div>

                        <div>
                            <p class="text-xs text-zinc-500 uppercase font-bold mb-2">Casas & Jogos</p>
                            <div class="flex flex-wrap gap-2">
                                ${(entry.houses || []).map(h => `<span class="px-2 py-1 bg-pink-500/10 text-pink-400 border border-pink-500/20 rounded text-xs">${h}</span>`).join('')}
                                ${entry.games.map(g => `<span class="px-2 py-1 bg-zinc-800 text-zinc-400 border border-zinc-700 rounded text-xs">${g}</span>`).join('')}
                            </div>
                        </div>
                    </div>
                </div>
            `;
            lucide.createIcons();
        }

        let chartInstance = null;

        function renderChart(data) {
            const ctx = document.getElementById('profitChart');
            if(!ctx) return;
            
            if (chartInstance) {
                chartInstance.destroy();
            }

            const labels = data.map(d => d.date.slice(0, 5));
            const bankrolls = data.map(d => d.bankroll);

            chartInstance = new Chart(ctx.getContext('2d'), {
                type: 'line',
                data: {
                    labels: labels,
                    datasets: [{
                        label: 'Banca Total',
                        data: bankrolls,
                        borderColor: '#ec4899',
                        backgroundColor: (context) => {
                            const ctx = context.chart.ctx;
                            const gradient = ctx.createLinearGradient(0, 0, 0, 300);
                            gradient.addColorStop(0, 'rgba(236, 72, 153, 0.2)');
                            gradient.addColorStop(1, 'rgba(236, 72, 153, 0)');
                            return gradient;
                        },
                        borderWidth: 3,
                        fill: true,
                        pointBackgroundColor: '#09090b',
                        pointBorderColor: '#ec4899',
                        pointBorderWidth: 2,
                        pointRadius: 6,
                        tension: 0.4
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: {
                        legend: { display: false },
                        tooltip: {
                            backgroundColor: '#18181b',
                            titleColor: '#ec4899',
                            bodyColor: '#fff',
                            borderColor: '#3f3f46',
                            borderWidth: 1,
                            padding: 12,
                            displayColors: false,
                            callbacks: {
                                label: function(context) {
                                    return formatCurrency(context.raw);
                                }
                            }
                        }
                    },
                    scales: {
                        x: {
                            grid: { display: false },
                            ticks: { color: '#71717a', font: { family: 'Inter', size: 11 } }
                        },
                        y: {
                            grid: { color: '#27272a', borderDash: [5, 5] },
                            border: { display: false },
                            ticks: {
                                color: '#71717a',
                                font: { family: 'JetBrains Mono', size: 10 },
                                callback: function(value) { return 'R$' + (value / 1000) + 'k'; }
                            }
                        }
                    }
                }
            });
        }

        // Init
        document.addEventListener('DOMContentLoaded', () => {
            switchTab('overview');
        });

    </script>
